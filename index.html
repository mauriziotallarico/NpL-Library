    const gallery = document.getElementById('gallery');
    const searchInput = document.getElementById('search');
    let activeLib = 'all';
    
    function renderGallery() {
        const query = searchInput.value.toLowerCase().trim();
        
        let filtered = ITEMS;
        if (activeLib !== 'all') {
            filtered = filtered.filter(item => item.lib === activeLib);
        }
        if (query) {
            filtered = filtered.filter(item => 
                item.title.toLowerCase().includes(query) || 
                (item.author && item.author.toLowerCase().includes(query))
            );
        }
        
        if (filtered.length === 0) {
            gallery.innerHTML = '<div class="empty-state">Nessun risultato trovato 🤷</div>';
            return;
        }
        
        gallery.innerHTML = filtered.map(item => `
            <a class="card" href="${item.url}" target="_blank" title="${item.title}${item.author ? ' — ' + item.author : ''}">
                ${item.cover 
                    ? `<img class="cover" src="${item.cover}" alt="${item.title}" loading="lazy" onerror="this.outerHTML='<div class=\'no-cover\'>📖</div>'">`
                    : '<div class="no-cover">📖</div>'
                }
                <div class="info">
                    <div class="title">${item.title}</div>
                    ${item.author ? `<div class="author">${item.author}</div>` : ''}
                </div>
            </a>
        `).join('');
    }
    
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            activeLib = tab.dataset.lib;
            renderGallery();
        });
    });
    
    // Search
    searchInput.addEventListener('input', renderGallery);
    
    // Initial render
    renderGallery();
    </script>
